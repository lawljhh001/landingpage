<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>상담 관리자 | 법무사이장헌사무소</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root {
  --blue: #3182F6;
  --blue-bg: #EBF3FF;
  --blue-dark: #1B64DA;
  --purple: #6C47FF;
  --green: #05C072;
  --green-bg: #E8FBF3;
  --orange: #FF8B37;
  --orange-bg: #FFF3EA;
  --gray: #8B95A1;
  --gray-bg: #F2F4F6;
  --red: #F04452;
  --red-bg: #FFF0F1;
  --t1: #191F28;
  --t2: #4E5968;
  --t3: #6B7684;
  --border: #E5E8EB;
  --bg: #F8F9FA;
  --white: #ffffff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--t1);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.02em;
}

/* ===== 로그인 ===== */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(135deg, #EBF3FF 0%, #F0EDFF 100%);
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--white);
  border-radius: 24px;
  padding: 40px 36px;
  box-shadow: 0 12px 48px rgba(25,31,40,.10);
}
.login-logo { font-size: 38px; margin-bottom: 16px; }
.login-title { font-size: 24px; font-weight: 800; color: var(--t1); margin-bottom: 6px; letter-spacing: -0.03em; }
.login-sub { font-size: 14px; color: var(--t3); margin-bottom: 28px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--t2); margin-bottom: 6px; }
.field input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  font-family: inherit;
  font-size: 15px;
  color: var(--t1);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  letter-spacing: -.01em;
  background: var(--white);
}
.field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(49,130,246,.12); }
.login-err {
  font-size: 13px; color: var(--red);
  background: var(--red-bg); border-radius: 12px;
  padding: 10px 14px; margin-bottom: 14px; display: none;
  line-height: 1.5;
}
.btn-login {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: var(--white); border: none; border-radius: 50px;
  font-family: inherit; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all .22s;
  letter-spacing: -.02em; margin-top: 4px;
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(49,130,246,.35); }
.btn-login:disabled { background: var(--gray-bg); color: var(--gray); cursor: not-allowed; transform: none; box-shadow: none; }

/* ===== 앱 레이아웃 ===== */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 0 24px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { font-size: 22px; }
.brand-name { font-size: 16px; font-weight: 800; letter-spacing: -.03em; }
.header-right { display: flex; align-items: center; gap: 8px; }
.last-sync-txt { font-size: 12px; color: var(--t3); }
.btn-icon {
  width: 36px; height: 36px;
  background: transparent; border: none;
  border-radius: 10px; font-size: 18px;
  cursor: pointer; color: var(--t2);
  transition: background .2s; display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: var(--gray-bg); }
.btn-icon.spin { animation: rotate .7s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }
.btn-text {
  background: transparent; border: none;
  font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--t3); cursor: pointer;
  padding: 6px 12px; border-radius: 8px; transition: all .2s;
}
.btn-text:hover { background: var(--gray-bg); color: var(--t1); }

.app-main {
  max-width: 1280px; margin: 0 auto;
  padding: 28px 24px 80px;
}

/* ===== 통계 카드 ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
@media (max-width: 680px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
.stat-card {
  background: var(--white);
  border-radius: 20px; padding: 20px 22px;
  border: 1.5px solid var(--border);
  transition: all .2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(25,31,40,.07); }
.stat-label { font-size: 12px; font-weight: 700; color: var(--t3); margin-bottom: 10px; }
.stat-num { font-size: 34px; font-weight: 900; letter-spacing: -.04em; color: var(--t1); font-variant-numeric: tabular-nums; }
.stat-card.c-blue  .stat-num { color: var(--blue); }
.stat-card.c-orange .stat-num { color: var(--orange); }
.stat-card.c-green  .stat-num { color: var(--green); }

/* ===== 툴바 ===== */
.toolbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.search-box {
  flex: 1; min-width: 200px; position: relative;
}
.search-icon {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%); font-size: 14px; pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 11px 14px 11px 36px;
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; color: var(--t1);
  background: var(--white); outline: none;
  transition: border-color .2s;
}
.search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(49,130,246,.1); }
.filter-select, .export-btn {
  padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; color: var(--t1);
  background: var(--white); cursor: pointer; outline: none;
  transition: all .2s;
}
.export-btn { font-weight: 700; white-space: nowrap; }
.export-btn:hover, .filter-select:hover { border-color: var(--blue); color: var(--blue); }

/* ===== 테이블 ===== */
.table-card {
  background: var(--white); border-radius: 20px;
  border: 1.5px solid var(--border); overflow: hidden;
  margin-bottom: 16px;
}
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  padding: 12px 16px;
  font-size: 11px; font-weight: 700; color: var(--t3);
  text-align: left; background: #FAFBFC;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; letter-spacing: 0;
}
.data-table td {
  padding: 14px 16px;
  font-size: 14px;
  border-bottom: 1px solid #F5F6F8;
  vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: #FAFBFF; }
.td-time { font-size: 12px; color: var(--t3); line-height: 1.4; white-space: nowrap; }
.td-name { font-weight: 700; }
.td-phone a { color: var(--blue); font-weight: 700; text-decoration: none; }
.td-phone a:hover { text-decoration: underline; }
.chip {
  display: inline-block; padding: 4px 10px;
  border-radius: 100px; font-size: 12px; font-weight: 700;
  background: var(--gray-bg); color: var(--t2);
}

/* 상태 드롭다운 */
.status-sel {
  padding: 6px 10px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--t1); background: var(--white);
  cursor: pointer; outline: none; transition: border-color .2s; min-width: 90px;
}
.status-sel:focus { border-color: var(--blue); }
.status-sel:disabled { opacity: .5; cursor: wait; }
.status-sel[data-v="신규"]   { color: var(--blue); }
.status-sel[data-v="연락중"] { color: var(--orange); }
.status-sel[data-v="완료"]   { color: var(--green); }
.status-sel[data-v="불가"]   { color: var(--gray); }

/* 빈 상태 */
.empty { text-align: center; padding: 64px 24px; color: var(--t3); }
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty-txt { font-size: 15px; font-weight: 700; }
.empty-sub { font-size: 13px; margin-top: 6px; }

/* 로딩 */
.loading { text-align: center; padding: 64px 24px; }
.loader {
  width: 32px; height: 32px;
  border: 3px solid var(--border); border-top-color: var(--blue);
  border-radius: 50%; animation: rotate .7s linear infinite;
  margin: 0 auto 14px;
}

/* ===== 페이지네이션 ===== */
.pages {
  display: flex; align-items: center;
  justify-content: center; gap: 6px; flex-wrap: wrap;
}
.pg-btn {
  padding: 8px 14px;
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--t2); cursor: pointer; transition: all .2s;
}
.pg-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.pg-btn:disabled { opacity: .4; cursor: not-allowed; }
.pg-btn.on { background: var(--blue); color: var(--white); border-color: var(--blue); }
.pg-info { font-size: 13px; color: var(--t3); padding: 0 6px; }

/* ===== 모바일: 카드 레이아웃 ===== */
@media (max-width: 768px) {
  .app-main { padding: 16px 16px 80px; }
  .header-inner { padding: 0 16px; }
  .last-sync-txt { display: none; }
  .export-btn { display: none; }

  /* 테이블 → 카드 변환 */
  .data-table, .data-table thead, .data-table tbody,
  .data-table th, .data-table td, .data-table tr { display: block; }
  .data-table thead { display: none; }
  .data-table tr {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .data-table tr:last-child { border-bottom: none; }
  .data-table td { padding: 0; border: none; }
  .td-time { order: -1; font-size: 11px; }
  .td-name { font-size: 18px; font-weight: 800; }
  .td-phone { font-size: 16px; }
  .td-status { display: flex; align-items: center; justify-content: space-between; }
}

/* ===== 토스트 ===== */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: var(--t1); color: var(--white);
  padding: 12px 22px; border-radius: 50px;
  font-size: 14px; font-weight: 600;
  z-index: 999; pointer-events: none;
  white-space: nowrap; letter-spacing: -.02em;
  transition: transform .35s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 4px 20px rgba(25,31,40,.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok  { background: var(--green); }
.toast.err { background: var(--red); }
</style>
</head>
<body>

<!-- ===== 로그인 화면 ===== -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">⚖️</div>
    <h1 class="login-title">상담 관리 시스템</h1>
    <p class="login-sub">법무사이장헌사무소</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="pwIn">관리자 비밀번호</label>
        <input id="pwIn" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required />
      </div>
      <div id="loginErr" class="login-err"></div>
      <button type="submit" id="loginBtn" class="btn-login">접속하기 →</button>
    </form>
  </div>
</div>

<!-- ===== 관리자 앱 ===== -->
<div id="app" style="display:none">

  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-logo">⚖️</span>
        <span class="brand-name">상담 관리</span>
      </div>
      <div class="header-right">
        <span id="syncTxt" class="last-sync-txt"></span>
        <button id="refreshBtn" class="btn-icon" title="새로고침">↻</button>
        <button id="logoutBtn" class="btn-text">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div id="statsRow" class="stats-row"></div>

    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="searchIn" type="search" class="search-input" placeholder="이름, 연락처 검색..." />
      </div>
      <select id="statusFilter" class="filter-select">
        <option value="">전체 상태</option>
        <option value="신규">🔵 신규</option>
        <option value="연락중">🟠 연락중</option>
        <option value="완료">🟢 완료</option>
        <option value="불가">⚫ 불가</option>
      </select>
      <button id="exportBtn" class="export-btn">📥 CSV 내보내기</button>
    </div>

    <div class="table-card">
      <div id="tableWrap"></div>
    </div>

    <div id="pages" class="pages"></div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
// ===== 설정 =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweg0_j0rHD_7gd3zPTbdaLL6-SWpGRNar3cegUzutFadDavjX0z4zI-ZU0sZa3y28_/exec";

// ===== 상태 =====
const S = {
  url:      SCRIPT_URL,
  pw:       sessionStorage.getItem("_aPw") || "",
  all:      [],   // 전체 데이터
  view:     [],   // 필터링된 데이터
  page:     1,
  perPage:  20,
  filter:   "",
  query:    "",
  pending:  new Set(),
  lastSync: null
};

// ===== 초기화 =====
document.addEventListener("DOMContentLoaded", () => {
  if (S.url && S.pw) { showApp(); loadData(); }

  document.getElementById("loginForm").addEventListener("submit", doLogin);
  document.getElementById("refreshBtn").addEventListener("click", loadData);
  document.getElementById("logoutBtn").addEventListener("click", doLogout);
  document.getElementById("searchIn").addEventListener("input", e => {
    S.query = e.target.value.trim();
    S.page = 1;
    filter(); renderTable(); renderPages();
  });
  document.getElementById("statusFilter").addEventListener("change", e => {
    S.filter = e.target.value;
    S.page = 1;
    filter(); renderAll();
  });
  document.getElementById("exportBtn").addEventListener("click", doExport);
});

// ===== 로그인 =====
async function doLogin(e) {
  e.preventDefault();
  const pw  = document.getElementById("pwIn").value;
  const errEl = document.getElementById("loginErr");
  const btn   = document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "연결 중...";
  errEl.style.display = "none";

  try {
    S.url = SCRIPT_URL; S.pw = pw;
    const r = await api({ action: "list" });
    if (r.error === "unauthorized") throw new Error("비밀번호가 올바르지 않습니다.");

    sessionStorage.setItem("_aPw", pw);
    S.all = r.data || [];
    S.lastSync = new Date();
    filter();
    showApp();
    renderAll();
    updateSync();
  } catch (err) {
    let msg = err.message;
    if (msg.includes("Failed to fetch") || msg.includes("NetworkError") || msg.includes("CORS")) {
      msg = "연결 실패: Apps Script 배포 설정 확인 필요\n→ 배포 > 배포 관리 > 액세스 권한을 \"모든 사용자\"로 설정하세요.";
    }
    errEl.textContent = msg;
    errEl.style.display = "block";
    S.url = SCRIPT_URL; S.pw = "";
  } finally {
    btn.disabled = false;
    btn.textContent = "접속하기 →";
  }
}

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function doLogout() {
  sessionStorage.removeItem("_aPw");
  S.url = SCRIPT_URL; S.pw = ""; S.all = []; S.view = [];
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("pwIn").value = "";
}

// ===== API =====
async function api(params) {
  const u = new URL(S.url);
  u.searchParams.set("pw", S.pw);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, String(v));
  const r = await fetch(u.toString());
  if (!r.ok) throw new Error("HTTP " + r.status);
  const json = await r.json();
  if (json.error === "unauthorized") throw new Error("unauthorized");
  return json;
}

async function loadData() {
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spin");
  try {
    const r = await api({ action: "list" });
    S.all = r.data || [];
    S.lastSync = new Date();
    updateSync();
    filter();
    renderAll();
  } catch (err) {
    toast("데이터 로드 실패: " + err.message, "err");
  } finally {
    btn.classList.remove("spin");
  }
}

async function updateStatus(rowIndex, sel) {
  if (S.pending.has(rowIndex)) return;
  const newStatus = sel.value;
  const item = S.all.find(r => r.rowIndex === rowIndex);
  const prev = item ? item.status : newStatus;

  sel.disabled = true;
  S.pending.add(rowIndex);
  sel.setAttribute("data-v", newStatus);

  try {
    await api({ action: "update", row: rowIndex, status: newStatus });
    if (item) item.status = newStatus;
    filter();
    renderStats();
    toast(`"${newStatus}"으로 변경됨`, "ok");
  } catch {
    sel.value = prev;
    sel.setAttribute("data-v", prev);
    toast("저장 실패. 다시 시도해주세요.", "err");
  } finally {
    sel.disabled = false;
    S.pending.delete(rowIndex);
  }
}

// ===== 필터 =====
function filter() {
  let items = S.all;
  if (S.filter) items = items.filter(r => r.status === S.filter);
  if (S.query) {
    const q = S.query.toLowerCase();
    items = items.filter(r =>
      r.name.toLowerCase().includes(q) ||
      r.phone.replace(/-/g,"").includes(q.replace(/-/g,""))
    );
  }
  S.view = items;
}

// ===== 렌더 =====
function renderAll() { renderStats(); renderTable(); renderPages(); }

function renderStats() {
  const d = S.all;
  const cards = [
    { label: "전체 신청",  n: d.length, cls: "" },
    { label: "신규",       n: d.filter(r => r.status === "신규").length,   cls: "c-blue" },
    { label: "연락중",     n: d.filter(r => r.status === "연락중").length, cls: "c-orange" },
    { label: "완료",       n: d.filter(r => r.status === "완료").length,   cls: "c-green" }
  ];
  document.getElementById("statsRow").innerHTML = cards.map(c =>
    `<div class="stat-card ${c.cls}"><div class="stat-label">${c.label}</div><div class="stat-num">${c.n}</div></div>`
  ).join("");
}

function renderTable() {
  const total = S.view.length;
  const start = (S.page - 1) * S.perPage;
  const items = S.view.slice(start, start + S.perPage);
  const el = document.getElementById("tableWrap");

  if (total === 0) {
    const isFiltered = S.query || S.filter;
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">${isFiltered ? "🔍" : "📋"}</div>
      <div class="empty-txt">${isFiltered ? "검색 결과가 없습니다" : "아직 신청 내역이 없습니다"}</div>
      <div class="empty-sub">${isFiltered ? "검색어나 필터를 변경해 보세요" : "첫 신청을 기다리고 있습니다"}</div>
    </div>`;
    return;
  }

  const opts = ["신규", "연락중", "완료", "불가"];
  el.innerHTML = `
    <table class="data-table">
      <thead>
        <tr>
          <th>접수일시</th><th>성함</th><th>연락처</th>
          <th>채무금액</th><th>직업상태</th><th>희망시간</th><th>처리상태</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(r => `
          <tr>
            <td class="td-time">${fmtTime(r.timestamp)}</td>
            <td class="td-name">${esc(r.name)}</td>
            <td class="td-phone"><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
            <td><span class="chip">${esc(r.debt)}</span></td>
            <td>${esc(r.job)}</td>
            <td>${esc(r.time)}</td>
            <td class="td-status">
              <select class="status-sel" data-v="${esc(r.status)}"
                onchange="updateStatus(${r.rowIndex}, this)">
                ${opts.map(o => `<option${o === r.status ? " selected" : ""}>${o}</option>`).join("")}
              </select>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

function renderPages() {
  const pages = Math.ceil(S.view.length / S.perPage);
  const el = document.getElementById("pages");
  if (pages <= 1) { el.innerHTML = ""; return; }

  const range = pageRange(S.page, pages);
  let html = `<button class="pg-btn" onclick="gp(${S.page-1})" ${S.page===1?"disabled":""}>← 이전</button>`;
  range.forEach(p => {
    html += p === "…"
      ? `<span class="pg-info">…</span>`
      : `<button class="pg-btn${p===S.page?" on":""}" onclick="gp(${p})">${p}</button>`;
  });
  html += `<button class="pg-btn" onclick="gp(${S.page+1})" ${S.page===pages?"disabled":""}>다음 →</button>`;
  html += `<span class="pg-info">${S.view.length}건 중 ${(S.page-1)*S.perPage+1}~${Math.min(S.page*S.perPage,S.view.length)}</span>`;
  el.innerHTML = html;
}

function pageRange(cur, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  const r = [1];
  if (cur > 3) r.push("…");
  for (let i = Math.max(2,cur-1); i <= Math.min(total-1,cur+1); i++) r.push(i);
  if (cur < total-2) r.push("…");
  r.push(total);
  return r;
}

function gp(p) {
  const pages = Math.ceil(S.view.length / S.perPage);
  if (p < 1 || p > pages) return;
  S.page = p;
  renderTable(); renderPages();
  window.scrollTo({top:0,behavior:"smooth"});
}

// ===== CSV 내보내기 =====
function doExport() {
  if (!S.view.length) { toast("내보낼 데이터가 없습니다", "err"); return; }
  const h = ["접수일시","성함","연락처","채무금액","직업상태","연락희망시간","처리상태"];
  const rows = S.view.map(r =>
    [r.timestamp,r.name,r.phone,r.debt,r.job,r.time,r.status]
      .map(v => `"${String(v||"").replace(/"/g,'""')}"`)
  );
  const csv = "﻿" + [h.join(","), ...rows.map(r=>r.join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `상담신청_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV 다운로드 시작!", "ok");
}

// ===== 유틸 =====
function fmtTime(ts) {
  if (!ts) return "";
  const parts = String(ts).split(" ");
  return parts.length >= 2
    ? `${parts[0]}<br><span style="color:#B0B8C1">${parts[1]}</span>`
    : ts;
}

function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function updateSync() {
  if (!S.lastSync) return;
  const h = S.lastSync.getHours().toString().padStart(2,"0");
  const m = S.lastSync.getMinutes().toString().padStart(2,"0");
  const el = document.getElementById("syncTxt");
  if (el) el.textContent = `${h}:${m} 동기화`;
}

let _toastTimer;
function toast(msg, type="") {
  clearTimeout(_toastTimer);
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast " + type;
  el.classList.add("show");
  _toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
</script>
